name: Pulsewave
options:
  bundleIdPrefix: com.bala
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Pulsewave:
    type: application
    platform: macOS
    sources:
      - path: AudioVisualiser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bala.Pulsewave
        INFOPLIST_FILE: AudioVisualiser/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: AudioVisualiser/Support/Pulsewave.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: AudioVisualiser/Support/Info.plist
      properties:
        CFBundleDisplayName: Pulsewave
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        NSMicrophoneUsageDescription: "Pulsewave uses the microphone to analyze audio and drive the visualizer."
        NSAudioCaptureUsageDescription: "Pulsewave captures system audio playback to drive the visualizer in real time."
        NSAppleEventsUsageDescription: "Pulsewave reads the current track from Music, Spotify and your browser to show what is playing."
        LSApplicationCategoryType: "public.app-category.music"
        LSUIElement: false
        NSHumanReadableCopyright: ""
    entitlements:
      path: AudioVisualiser/Support/Pulsewave.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
