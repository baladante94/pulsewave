name: AudioVisualiser
options:
  bundleIdPrefix: com.bala
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  AudioVisualiser:
    type: application
    platform: macOS
    sources:
      - path: AudioVisualiser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bala.AudioVisualiser
        INFOPLIST_FILE: AudioVisualiser/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: AudioVisualiser/Support/AudioVisualiser.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: AudioVisualiser/Support/Info.plist
      properties:
        CFBundleDisplayName: AudioVisualiser
        NSMicrophoneUsageDescription: "AudioVisualiser uses the microphone to analyze audio and drive the visualizer."
        NSAudioCaptureUsageDescription: "AudioVisualiser captures system audio playback to drive the visualizer in real time."
        LSApplicationCategoryType: "public.app-category.music"
        LSUIElement: false
        NSHumanReadableCopyright: ""
    entitlements:
      path: AudioVisualiser/Support/AudioVisualiser.entitlements
      properties:
        com.apple.security.app-sandbox: false
